spring:
  application:
    name: saas-backend
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saas_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate # NUNCA usar update/create en prod. Flyway manda.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  security:
    jwt:
      # Debe inyectarse por variable de entorno en prod (mínimo 256 bits)
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: 900000 # 15 minutos
      refresh-token-expiration-ms: 604800000 # 7 días
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
