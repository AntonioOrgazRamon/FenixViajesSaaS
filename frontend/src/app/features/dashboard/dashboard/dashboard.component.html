<div class="dashboard-layout">
  <!-- Sidebar (Desktop) / Bottom Nav (Mobile) -->
  <aside class="sidebar">
    <div class="brand hide-mobile">
      <h2>SaaS<span>Core</span></h2>
    </div>
    
    <div class="user-profile hide-mobile" *ngIf="user()">
      <div class="avatar">{{ user()?.fullName?.charAt(0) }}</div>
      <div class="info">
        <strong>{{ user()?.fullName }}</strong>
        <span class="role">{{ user()?.isSuperAdmin ? 'Super Admin' : 'Usuario' }}</span>
      </div>
    </div>

    <nav class="menu">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <span class="icon">📊</span>
        <span class="text">Dashboard</span>
      </a>
      <a routerLink="/dashboard/admin/companies" routerLinkActive="active" *ngIf="user()?.isSuperAdmin">
        <span class="icon">🏢</span>
        <span class="text">Empresas</span>
      </a>
      <a href="#" (click)="$event.preventDefault()">
        <span class="icon">🔧</span>
        <span class="text">Ajustes</span>
      </a>
      <a href="#" class="mobile-logout show-mobile" (click)="logout(); $event.preventDefault()">
        <span class="icon">🚪</span>
        <span class="text">Salir</span>
      </a>
    </nav>

    <button class="btn-logout hide-mobile" (click)="logout()">Cerrar Sesión</button>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <header class="topbar">
      <div class="mobile-brand show-mobile">
        <h2>SaaS<span>Core</span></h2>
      </div>
      
      <div class="topbar-right">
        <div class="tenant-selector" *ngIf="!user()?.isSuperAdmin && user()?.memberships?.length">
          <label class="hide-mobile">Empresa Activa:</label>
          <select [value]="authService.activeCompanyId()">
            <option *ngFor="let m of user()?.memberships" [value]="m.companyId">
              {{ m.companyName }} ({{ m.role }})
            </option>
          </select>
        </div>
        <div class="tenant-selector super-admin" *ngIf="user()?.isSuperAdmin">
          <span class="badge">Modo Dios Activado</span>
        </div>
      </div>
    </header>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
