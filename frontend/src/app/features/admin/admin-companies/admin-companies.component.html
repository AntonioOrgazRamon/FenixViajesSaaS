<div class="admin-container">
  <h2>Gestión de Empresas</h2>
  <p class="subtitle">Panel exclusivo para Super Administradores</p>

  <div *ngIf="loading" class="loading">Cargando empresas...</div>

  <div class="companies-grid" *ngIf="!loading">
    <div class="company-card" *ngFor="let company of companies" [class.active]="selectedCompanyId === company.id">
      <div class="company-header" (click)="loadUsers(company.id)">
        <div class="company-info">
          <h3>{{ company.name }}</h3>
          <span class="badge" [ngClass]="company.status">{{ company.status }}</span>
        </div>
        <button class="btn-toggle">
          {{ selectedCompanyId === company.id ? 'Ocultar Usuarios' : 'Ver Usuarios' }}
        </button>
      </div>

      <div class="users-section" *ngIf="selectedCompanyId === company.id">
        <div *ngIf="loadingUsers" class="loading-small">Cargando usuarios...</div>
        
        <div class="users-list" *ngIf="!loadingUsers">
          <div class="user-item" *ngFor="let user of selectedCompanyUsers">
            <div class="user-avatar">{{ user.fullName.charAt(0) }}</div>
            <div class="user-details">
              <strong>{{ user.fullName }}</strong>
              <span class="email">{{ user.email }}</span>
            </div>
            <div class="user-role">
              <span class="badge-role" [ngClass]="user.role">{{ user.role }}</span>
            </div>
          </div>
          <div *ngIf="selectedCompanyUsers.length === 0" class="no-users">
            No hay usuarios en esta empresa.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
