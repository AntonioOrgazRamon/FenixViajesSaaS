<div class="login-container">
  <div class="login-box">
    <div class="logo">
      <h2>SaaS<span>Core</span></h2>
    </div>
    
    <p class="subtitle">Accede a tu espacio de trabajo</p>

    <div *ngIf="error" class="alert error">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="ejemplo@empresa.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Verificando...' : 'Iniciar Sesión' }}
      </button>
    </form>
    
    <div class="demo-credentials">
      <small><strong>Demo:</strong> toni&#64;nakedcode.com / tonitoni</small><br>
      <small><strong>Admin:</strong> antonio&#64;nakedcode.com / antonioantonio</small><br>
      <small><strong>Super:</strong> cebollita&#64;admin.com / Yonimelabo76</small>
    </div>
  </div>
</div>
